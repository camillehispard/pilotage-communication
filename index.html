<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilotage Communication — Saint-Ouen-sur-Seine</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#14213d}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:#10233e;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:22px;font-weight:800;line-height:1.05}.sub{font-size:12px;color:#b8c4d5;margin:6px 0 24px}
nav button{display:block;width:100%;border:0;background:none;color:#e7edf6;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0;cursor:pointer;font-size:14px}nav button:hover,nav button.active{background:#1769e0}
.group{font-size:10px;color:#8ea0b8;margin:22px 12px 8px;text-transform:uppercase;letter-spacing:.08em}main{padding:26px 28px;min-width:0}
header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.topright{display:flex;gap:9px;align-items:center}.search{border:1px solid #dce3ed;background:#fff;padding:10px 12px;border-radius:10px;min-width:260px}.user{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;font-size:13px}
h1{margin:0 0 4px;font-size:28px}h2{margin:0;font-size:18px}.muted{color:#64748b;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:17px}.metric,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px}.metric{padding:16px}.metric strong{font-size:27px;display:block}.metric span{font-size:12px;color:#64748b}.yellow{background:#fff7d6}.red{background:#fff0f0}.greenbox{background:#ecfdf3}
.card{overflow:hidden;margin-bottom:16px}.cardhead{padding:15px 17px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:12px}.pad{padding:17px}
.btn{border:0;background:#1769e0;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef3f8;color:#20324c}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:6px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 13px;border-bottom:1px solid #edf2f7;text-align:left;font-size:12px;vertical-align:middle}th{font-size:10px;color:#64748b;background:#fafcff;text-transform:uppercase}tr.click{cursor:pointer}tr.click:hover{background:#f8fbff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}.blue{background:#2672e8}.pink{background:#e83e8c}.green{background:#20a36a}.purple{background:#7c4de8}.orange{background:#f59e0b}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:11px}.pill.cab{background:#fff2c2;color:#7a5700}.pill.dir{background:#eee6ff;color:#6330b8}.pill.done{background:#dcfce7;color:#166534}.pill.block{background:#fee2e2;color:#991b1b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:11px 0;border-bottom:1px solid #edf2f7;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select,.filters input,input,select,textarea{border:1px solid #d7dee8;border-radius:8px;padding:9px;background:#fff;font:inherit}textarea{width:100%;min-height:85px}.polecard{border-left:5px solid #2672e8}.polecard:nth-child(2){border-left-color:#e83e8c}.polecard:nth-child(3){border-left-color:#20a36a}.polecard:nth-child(4){border-left-color:#7c4de8}.polecard:nth-child(5){border-left-color:#f59e0b}
.task{display:grid;grid-template-columns:minmax(180px,1.6fr) 130px 120px 170px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf2f7}.task input,.task select{width:100%;font-size:12px}.projecttop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.back{cursor:pointer;color:#1769e0;font-weight:700;font-size:13px;margin-bottom:10px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid #e2e8f0;border-radius:10px;min-height:110px;padding:8px}.day strong{font-size:11px}.calproj{margin-top:6px;padding:5px;background:#eaf3ff;border-radius:6px;font-size:10px;cursor:pointer}
.modal{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modalbox{background:#fff;width:min(620px,100%);border-radius:15px;padding:20px;max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;color:#475569}.formgrid label span{display:block;margin-bottom:5px}.hidden{display:none!important}.comment{background:#f8fafc;border-radius:8px;padding:8px;margin-top:7px;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#10233e;color:white;padding:12px 15px;border-radius:10px;z-index:100}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr 110px 110px}.task .optional{display:none}.grid2,.grid3{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}aside{display:none}main{padding:16px}.search{min-width:0;width:150px}.calendar{grid-template-columns:repeat(2,1fr)}}
.formgrid small{display:block;margin-top:4px}.pill{white-space:nowrap}</style></head><body><div class="app"><aside><div class="logo">Saint-Ouen<br>sur-Seine</div><div class="sub">Direction de la communication<br>Pilotage des projets</div><nav id="nav"></nav></aside><main>
<header><div><h1 id="title">Bonjour Camille 👋</h1><div class="muted" id="subtitle">Pilotage des projets et actions de communication.</div></div><div class="topright"><input class="search" id="search" placeholder="Rechercher…"><div class="user">CH &nbsp; Camille Hispard</div></div></header><div id="view"></div></main></div>
<div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jmgipiplloyaddnnxili.supabase.co";
const SUPABASE_KEY="sb_publishable_4IrqHY4u4mW48uSR26DHHw_UVtoSozV";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const POLES=["Médias","Événementiel","Stratégie & contenus","Vidéo","Mission cinéma et partenariat"];
const TYPES=["Inauguration","Événementiel","Institutionnel","Réunion publique","Rencontre maire","Autre"];
const STATUSES=["À faire","En cours","À valider","À valider Direction com","Validé Direction com","En attente validation CAB","Validé CAB","En attente d’éléments","Bloqué","Programmé","Terminé"];
let me=null, profiles=[], projects=[], tasks=[], comments=[], notifications=[];
let current="dashboard", currentProject=null, poleFilter=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"Date à confirmer";
const toast=t=>{let e=$("#toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),1800)};
const profileName=id=>profiles.find(x=>x.id===id)?.full_name||"À attribuer";

async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session) return loginView();
 const {data:p,error}=await sb.rpc("claim_profile");
 if(error){console.error(error);return loginView("Connexion impossible : "+error.message)}
 me=p;
 await loadAll();
 subscribeRealtime();
 render();
}
function loginView(msg=""){
 $("#title").textContent="Pilotage Communication";
 $("#subtitle").textContent="Espace collaboratif de la Direction de la communication.";
 $("#view").innerHTML=`<section class="card" style="max-width:560px;margin:60px auto"><div class="cardhead"><h2>Connexion</h2></div><div class="pad">
 <p class="muted">Connectez-vous avec votre adresse professionnelle. Vous recevrez un lien de connexion par e-mail.</p>
 ${msg?`<p class="pill block">${esc(msg)}</p>`:""}
 <label class="muted">Adresse e-mail</label><input id="loginEmail" type="email" style="width:100%;margin:7px 0 12px" placeholder="prenom.nom@...">
 <button class="btn" id="loginBtn">Recevoir mon lien de connexion</button></div></section>`;
 $("#loginBtn").onclick=async()=>{let email=$("#loginEmail").value.trim();if(!email)return alert("Indiquez votre adresse e-mail.");
   const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});
   if(error) alert(error.message); else toast("Lien de connexion envoyé par e-mail");
 };
}
async function loadAll(){
 const [a,b,c,d,e]=await Promise.all([
  sb.from("profiles").select("*").order("full_name"),
  sb.from("projects").select("*").order("event_date",{ascending:true,nullsFirst:false}),
  sb.from("tasks").select("*").order("created_at"),
  sb.from("comments").select("*").order("created_at",{ascending:false}),
  sb.from("notifications").select("*").order("created_at",{ascending:false})
 ]);
 profiles=a.data||[]; projects=b.data||[]; tasks=c.data||[]; comments=d.data||[]; notifications=e.data||[];
}
function subscribeRealtime(){
 sb.channel("pilotage-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"projects"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"comments"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"notifications"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},refresh)
 .subscribe();
}
let refreshTimer;
function refresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{await loadAll();render()},250)}
function nav(){
 const unread=notifications.filter(n=>!n.read_at).length;
 $("#nav").innerHTML=`
 <button data-view="dashboard">▦ &nbsp; Tableau de bord</button>
 <button data-view="projects">☷ &nbsp; Tous les projets</button>
 <button data-view="calendar">□ &nbsp; Calendrier</button>
 <button data-view="my">✓ &nbsp; Mes tâches</button>
 <button data-view="notifications">🔔 &nbsp; Notifications ${unread?`<span class="pill cab">${unread}</span>`:""}</button>
 <div class="group">Pôles</div>${POLES.map(p=>`<button data-pole="${esc(p)}">${esc(p)}</button>`).join("")}
 <div class="group">Pilotage</div><button data-view="validations">✓ &nbsp; Validations</button><button data-view="team">⚙ &nbsp; Équipe & paramètres</button>
 <button id="logout">↪ &nbsp; Déconnexion</button>`;
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{current=b.dataset.view;currentProject=null;render()});
 document.querySelectorAll("[data-pole]").forEach(b=>b.onclick=()=>{current="pole";poleFilter=b.dataset.pole;render()});
 $("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
 $(".user").innerHTML=`${esc((me?.full_name||"Utilisateur").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())} &nbsp; ${esc(me?.full_name||"Utilisateur")}`;
}
function projectTasks(pid){return tasks.filter(t=>t.project_id===pid)}
function projectComments(pid){return comments.filter(c=>c.project_id===pid)}
function dashboard(){
 $("#title").textContent=`Bonjour ${me?.full_name?.split(" ")[0]||""} 👋`;$("#subtitle").textContent="Pilotage partagé des projets et actions de communication.";
 const active=projects.length, blocked=tasks.filter(t=>t.status==="Bloqué").length, dir=tasks.filter(t=>t.status==="À valider Direction com").length, cab=tasks.filter(t=>t.status==="En attente validation CAB").length, done=tasks.filter(t=>t.status==="Terminé"||t.status==="Validé CAB").length;
 $("#view").innerHTML=`<div class="metrics"><div class="metric"><strong>${active}</strong><span>Projets</span></div><div class="metric yellow"><strong>${dir}</strong><span>À valider Direction com</span></div><div class="metric yellow"><strong>${cab}</strong><span>En attente CAB</span></div><div class="metric red"><strong>${blocked}</strong><span>Bloquées</span></div><div class="metric greenbox"><strong>${done}</strong><span>Tâches terminées</span></div></div>
 <section class="card"><div class="cardhead"><h2>Projets</h2><button class="btn" id="newProject">+ Nouveau projet</button></div>${projectTable(projects.slice(0,12))}</section>`;
 $("#newProject").onclick=()=>projectModal();bindProjectRows();
}
function projectTable(list){
 return `<table><thead><tr><th>Projet</th><th>Date</th><th>Type</th><th>Avancement</th></tr></thead><tbody>${list.map(p=>{let ts=projectTasks(p.id),done=ts.filter(t=>["Terminé","Validé CAB"].includes(t.status)).length;return `<tr class="click" data-project="${p.id}"><td><b>${esc(p.name)}</b></td><td>${fmtDate(p.event_date)}</td><td>${esc(p.type)}</td><td>${done}/${ts.length}</td></tr>`}).join("")||'<tr><td colspan="4" class="muted">Aucun projet.</td></tr>'}</tbody></table>`
}
function bindProjectRows(){document.querySelectorAll("[data-project]").forEach(r=>r.onclick=()=>{currentProject=r.dataset.project;current="project";render()})}
function projectsView(filterPole=null){
 $("#title").textContent=filterPole||"Tous les projets";$("#subtitle").textContent=filterPole?"Projets comportant des actions de ce pôle.":"Tous les projets de communication.";
 let list=filterPole?projects.filter(p=>projectTasks(p.id).some(t=>t.pole===filterPole)):projects;
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><div class="filters"><input id="projSearch" placeholder="Rechercher un projet"><select id="typeFilter"><option value="">Tous les types</option>${TYPES.map(x=>`<option>${x}</option>`).join("")}</select></div><button class="btn" id="newProject">+ Nouveau projet</button></div><div id="ptable">${projectTable(list)}</div></section>`;
 const redraw=()=>{let q=$("#projSearch").value.toLowerCase(),ty=$("#typeFilter").value;let x=list.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!ty||p.type===ty));$("#ptable").innerHTML=projectTable(x);bindProjectRows()};
 $("#projSearch").oninput=redraw;$("#typeFilter").onchange=redraw;$("#newProject").onclick=()=>projectModal();bindProjectRows();
}
function myTasks(){
 $("#title").textContent="Mes tâches";$("#subtitle").textContent="Actions qui vous sont attribuées.";
 let mine=tasks.filter(t=>t.assignee_id===me.id);
 $("#view").innerHTML=`<section class="card"><div class="pad">${mine.map(t=>{let p=projects.find(x=>x.id===t.project_id);return `<div class="item"><div><b>${esc(t.title)}</b><br><span class="muted">${esc(p?.name||"")} · ${esc(t.pole)}</span></div><span class="pill">${esc(t.status)}</span></div>`}).join("")||'<span class="muted">Aucune tâche attribuée.</span>'}</div></section>`;
}
function notificationsView(){
 $("#title").textContent="Notifications";$("#subtitle").textContent="Mentions, affectations et validations.";
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><h2>Vos notifications</h2><button class="btn secondary small" id="readAll">Tout marquer comme lu</button></div><div class="pad">${notifications.map(n=>`<div class="item"><div><b>${esc(n.message)}</b><br><span class="muted">${new Date(n.created_at).toLocaleString("fr-FR")}</span></div>${n.read_at?'<span class="pill done">Lu</span>':'<span class="pill cab">Nouveau</span>'}</div>`).join("")||'<span class="muted">Aucune notification.</span>'}</div></section>`;
 $("#readAll").onclick=async()=>{await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",me.id).is("read_at",null);await refresh()};
}
function validations(){
 $("#title").textContent="Validations";$("#subtitle").textContent="Circuit Direction de la communication puis Cabinet.";
 const d=tasks.filter(t=>t.status==="À valider Direction com"), c=tasks.filter(t=>t.status==="En attente validation CAB");
 const block=(title,arr,stage)=>`<section class="card"><div class="cardhead"><h2>${title}</h2></div><div class="pad">${arr.map(t=>{let p=projects.find(x=>x.id===t.project_id);return `<div class="item"><div><b>${esc(t.title)}</b><br><span class="muted">${esc(p?.name||"")}</span></div><div><button class="btn small" data-approve="${t.id}" data-stage="${stage}">Valider</button> <button class="btn secondary small" data-return="${t.id}">Demander une modification</button></div></div>`}).join("")||'<span class="muted">Rien à valider.</span>'}</div></section>`;
 $("#view").innerHTML=block("Validation Direction com",d,"Direction com")+block("Validation CAB",c,"CAB");
 document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{let next=b.dataset.stage==="Direction com"?"Validé Direction com":"Validé CAB";await sb.from("tasks").update({status:next,updated_at:new Date().toISOString()}).eq("id",b.dataset.approve);toast("Validé");});
 document.querySelectorAll("[data-return]").forEach(b=>b.onclick=async()=>{await sb.from("tasks").update({status:"En cours",updated_at:new Date().toISOString()}).eq("id",b.dataset.return);toast("Renvoyé en modification");});
}
function teamView(){
 $("#title").textContent="Équipe & paramètres";$("#subtitle").textContent="Utilisateurs disponibles pour les affectations et @mentions.";
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><h2>Équipe</h2><button class="btn" id="addMember">+ Ajouter un membre</button></div><table><thead><tr><th>Nom</th><th>E-mail</th><th>Pôle</th><th>Rôle</th><th></th></tr></thead><tbody>${profiles.map(m=>`<tr><td><b>${esc(m.full_name)}</b></td><td>${esc(m.email)}</td><td>${esc(m.pole||"")}</td><td>${esc(m.role||"")}</td><td><button class="btn secondary small" data-edit="${m.id}">Modifier</button></td></tr>`).join("")}</tbody></table></section>`;
 $("#addMember").onclick=()=>memberModal();
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>memberModal(profiles.find(x=>x.id===b.dataset.edit)));
}
function memberModal(m=null){
 $("#modal").className="modal";$("#modal").innerHTML=`<div class="modalbox"><h2>${m?"Modifier":"Ajouter"} un membre</h2><div class="formgrid" style="margin-top:15px">
 <label><span>Nom et prénom</span><input id="mn" value="${esc(m?.full_name||"")}"></label><label><span>E-mail</span><input id="me" type="email" value="${esc(m?.email||"")}"></label>
 <label><span>Pôle</span><select id="mp"><option value="">—</option>${[...POLES,"Direction","Cabinet","Autre"].map(p=>`<option ${m?.pole===p?"selected":""}>${esc(p)}</option>`).join("")}</select></label>
 <label><span>Rôle</span><input id="mr" value="${esc(m?.role||"Membre")}"></label></div><div style="text-align:right;margin-top:15px"><button class="btn secondary" id="mc">Annuler</button> <button class="btn" id="ms">Enregistrer</button></div></div>`;
 $("#mc").onclick=()=>$("#modal").className="hidden";
 $("#ms").onclick=async()=>{let row={full_name:$("#mn").value.trim(),email:$("#me").value.trim().toLowerCase(),pole:$("#mp").value||null,role:$("#mr").value.trim()||"Membre",updated_at:new Date().toISOString()};if(!row.full_name||!row.email)return alert("Nom et e-mail obligatoires.");
 let q=m?sb.from("profiles").update(row).eq("id",m.id):sb.from("profiles").insert(row);let {error}=await q;if(error)return alert(error.message);$("#modal").className="hidden";toast("Membre enregistré")};
}
function calendar(){
 $("#title").textContent="Calendrier";$("#subtitle").textContent="Échéances des projets.";
 let by={};projects.forEach(p=>{if(p.event_date)(by[p.event_date]??=[]).push(p)});
 let dates=Object.keys(by).sort();
 $("#view").innerHTML=`<section class="card"><div class="pad">${dates.map(d=>`<div class="item"><div><b>${fmtDate(d)}</b></div><div>${by[d].map(p=>`<button class="btn secondary small" data-project="${p.id}">${esc(p.name)}</button>`).join(" ")}</div></div>`).join("")||'<span class="muted">Aucune date renseignée.</span>'}</div></section>`;bindProjectRows();
}
function projectView(){
 let p=projects.find(x=>x.id===currentProject);if(!p){current="projects";return render()}
 $("#title").textContent=p.name;$("#subtitle").textContent=`${fmtDate(p.event_date)} · ${p.type} · Priorité ${p.priority||"Normale"}`;
 let cards=POLES.map(po=>`<section class="card polecard"><div class="cardhead"><h2>${esc(po)}</h2><button class="btn secondary small" data-addtask="${esc(po)}">+ Ajouter une tâche</button></div><div class="pad">${projectTasks(p.id).filter(t=>t.pole===po).map(taskEditor).join("")||'<span class="muted">Aucune tâche.</span>'}</div></section>`).join("");
 $("#view").innerHTML=`<div class="back" id="back">← Retour aux projets</div><div style="text-align:right;margin-bottom:10px"><button class="btn secondary" id="editProject">Modifier le projet</button></div>${cards}
 <section class="card"><div class="cardhead"><h2>Fil d’activité / commentaires</h2></div><div class="pad">
 <textarea id="commentBox" placeholder="Écrire un commentaire. Tapez @ puis le prénom ou le nom d’un membre de l’équipe."></textarea>
 <div id="mentionHelp" class="muted" style="margin:6px 0">${profiles.map(x=>"@"+x.full_name).join(" · ")}</div>
 <button class="btn" id="sendComment">Ajouter</button>
 ${projectComments(p.id).map(c=>`<div class="comment"><b>${esc(profileName(c.author_id))}</b> · ${new Date(c.created_at).toLocaleString("fr-FR")}<br>${esc(c.body)}</div>`).join("")||'<div class="muted" style="margin-top:12px">Aucun commentaire.</div>'}</div></section>`;
 $("#back").onclick=()=>{current="projects";render()};$("#editProject").onclick=()=>projectModal(p);
 document.querySelectorAll("[data-addtask]").forEach(b=>b.onclick=()=>taskModal(p,b.dataset.addtask));
 document.querySelectorAll("[data-status]").forEach(s=>s.onchange=async()=>{await sb.from("tasks").update({status:s.value,updated_at:new Date().toISOString()}).eq("id",s.dataset.status);toast("Enregistré automatiquement")});
 document.querySelectorAll("[data-owner]").forEach(s=>s.onchange=async()=>{let id=s.value||null;await sb.from("tasks").update({assignee_id:id,updated_at:new Date().toISOString()}).eq("id",s.dataset.owner);if(id)await notify(id,p.id,s.dataset.owner,"assignment",`Une tâche vous a été attribuée : ${tasks.find(t=>t.id===s.dataset.owner)?.title||""}`);toast("Affectation enregistrée")});
 document.querySelectorAll("[data-due]").forEach(s=>s.onchange=async()=>{await sb.from("tasks").update({due_date:s.value||null,updated_at:new Date().toISOString()}).eq("id",s.dataset.due);toast("Échéance enregistrée")});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer cette tâche ?"))await sb.from("tasks").delete().eq("id",b.dataset.del)});
 $("#sendComment").onclick=async()=>{let body=$("#commentBox").value.trim();if(!body)return;let {data:c,error}=await sb.from("comments").insert({project_id:p.id,author_id:me.id,body}).select().single();if(error)return alert(error.message);
   let mentioned=profiles.filter(x=>body.toLowerCase().includes("@"+x.full_name.toLowerCase()));
   for(const u of mentioned){await sb.from("mentions").insert({comment_id:c.id,mentioned_user_id:u.id});await notify(u.id,p.id,null,"mention",`${me.full_name} vous a mentionné·e dans ${p.name}`)}
   $("#commentBox").value="";toast(mentioned.length?"Commentaire ajouté et notification envoyée":"Commentaire ajouté");
 };
}
function taskEditor(t){return `<div class="task"><div><b>${esc(t.title)}</b><br><span class="muted">${esc(t.deliverable_type||t.pole)}</span></div>
 <select data-owner="${t.id}"><option value="">À attribuer</option>${profiles.map(m=>`<option value="${m.id}" ${t.assignee_id===m.id?"selected":""}>${esc(m.full_name)}</option>`).join("")}</select>
 <input type="date" data-due="${t.id}" value="${esc(t.due_date||"")}"><select data-status="${t.id}">${STATUSES.map(s=>`<option ${s===t.status?"selected":""}>${esc(s)}</option>`).join("")}</select>
 <div><button class="btn danger small" data-del="${t.id}">×</button></div></div>`}
async function notify(uid,pid,tid,type,message){if(uid===me.id)return;await sb.from("notifications").insert({user_id:uid,project_id:pid,task_id:tid,type,message})}
function taskModal(p,pole){
 $("#modal").className="modal";$("#modal").innerHTML=`<div class="modalbox"><h2>Ajouter une tâche</h2><label class="muted">Tâche / livrable</label><input id="tt" style="width:100%;margin:7px 0 12px"><label class="muted">Échéance</label><input id="td" type="date" value="${p.event_date||""}" style="width:100%;margin:7px 0 12px"><div style="text-align:right"><button class="btn secondary" id="tc">Annuler</button> <button class="btn" id="ts">Ajouter</button></div></div>`;
 $("#tc").onclick=()=>$("#modal").className="hidden";$("#ts").onclick=async()=>{let title=$("#tt").value.trim();if(!title)return;let {error}=await sb.from("tasks").insert({project_id:p.id,pole,title,due_date:$("#td").value||null,status:"À faire",created_by:me.id});if(error)return alert(error.message);$("#modal").className="hidden";toast("Tâche ajoutée")};
}
function projectModal(p=null){
 $("#modal").className="modal";$("#modal").innerHTML=`<div class="modalbox"><h2>${p?"Modifier":"Nouveau"} projet</h2><div class="formgrid" style="margin-top:15px">
 <label><span>Nom</span><input id="pn" value="${esc(p?.name||"")}"></label>
 <label><span>Date</span><input id="pd" type="date" value="${esc(p?.event_date||"")}"><small class="muted">Laisser vide = date à confirmer</small></label>
 <label><span>Type</span><select id="pt">${TYPES.map(x=>`<option ${p?.type===x?"selected":""}>${x}</option>`).join("")}</select></label>
 <label><span>Priorité</span><select id="pp"><option ${p?.priority==="Normale"?"selected":""}>Normale</option><option ${p?.priority==="Haute"?"selected":""}>Haute</option></select></label></div>
 <label style="display:block;margin-top:10px"><span class="muted">Description</span><textarea id="px">${esc(p?.description||"")}</textarea></label>
 <div style="text-align:right;margin-top:15px"><button class="btn secondary" id="pc">Annuler</button> <button class="btn" id="ps">Enregistrer</button></div></div>`;
 $("#pc").onclick=()=>$("#modal").className="hidden";$("#ps").onclick=async()=>{let name=$("#pn").value.trim();if(!name)return alert("Le nom du projet est obligatoire.");let row={name,type:$("#pt").value,event_date:$("#pd").value||null,date_tbc:!$("#pd").value,priority:$("#pp").value,description:$("#px").value,updated_at:new Date().toISOString()};let error,newp;
 if(p){({error}=await sb.from("projects").update(row).eq("id",p.id))}else{row.created_by=me.id;let r=await sb.from("projects").insert(row).select().single();error=r.error;newp=r.data;if(newp){let defaults={"Médias":["Post réseaux sociaux","Article site","Mailing ARC"],"Événementiel":["Organisation / déroulé","Logistique"],"Stratégie & contenus":["Visuel / affiche","Éléments de langage"],"Vidéo":["Captation / montage"],"Mission cinéma et partenariat":["Partenaires / suivi"]};let rows=[];for(const po of POLES)for(const title of defaults[po])rows.push({project_id:newp.id,pole:po,title,due_date:newp.event_date,status:"À faire",created_by:me.id});await sb.from("tasks").insert(rows)}}
 if(error)return alert(error.message);$("#modal").className="hidden";toast("Projet enregistré automatiquement")};
}
function render(){nav();if(current==="dashboard")dashboard();else if(current==="projects")projectsView();else if(current==="pole")projectsView(poleFilter);else if(current==="my")myTasks();else if(current==="calendar")calendar();else if(current==="validations")validations();else if(current==="team")teamView();else if(current==="notifications")notificationsView();else if(current==="project")projectView()}
$("#search").oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;current="projects";projectsView();let i=$("#projSearch");if(i){i.value=q;i.dispatchEvent(new Event("input"))}}
init();
</script></body></html>
