.tbc-items{display:flex;gap:7px;flex-wrap:wrap}.tbc-item{border:1px solid #e1e8ef;background:#f8fafc;border-radius:999px;padding:6px 9px;font-size:10px;cursor:pointer}

</head><body><div class="app"><aside><div class="logo">Saint-Ouen<br>sur-Seine</div><div class="sub">Direction de la communication<br>Pilotage des projets</div><nav id="nav"></nav></aside><main>
<header><div><h1 id="title">Bonjour Camille 👋</h1><div class="muted" id="subtitle">Pilotage des projets et actions de communication.</div></div><div class="topright"><input class="search" id="search" placeholder="Rechercher…"><div class="user">CH &nbsp; Camille Hispard</div></div></header><div id="view"></div></main></div>
<div id="modal" class="hidden"></div><div id="toast" class="toast hidden"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG={url:"https://jmgipiplloyaddnnxili.supabase.co",key:"sb_publishable_4IrqHY4u4mW48uSR26DHHw_UVtoSozV"};
const POLES=["Médias","Événementiel","Stratégie & contenus","Vidéo","Mission cinéma et partenariat"];
const TEAM_POLES=[...POLES,"Photographie"];
const TYPES=["Inauguration","Événementiel","Institutionnel","Réunion publique","Rencontre maire","Proximité","Déplacement","Commémoration","Autre"];
const FULL_STATUSES=["À faire","En cours / en attente d’éléments","À valider Services / Directions","Validé Services / Directions","À valider Dir Com' / CAB","Validé Dirc Com' / CAB","Bloqué","Terminé","Envoi fait en impression"];
const LIGHT_STATUSES=["À faire","En cours","Terminé"];
const THEMES=["Éducation","Santé","Culture","Commerces","Proximité","Solidarité","Sport","Enfance","Jeunesse","Égalité","Logement","Sécurité","Végétalisation","Environnement","Vie locale","Institutionnel","Mémoire","Emploi","Mobilités","Autre"];
const THEME_COLORS=["#1769e0","#7c3aed","#db2777","#ea580c","#0891b2","#059669","#dc2626","#ca8a04","#4f46e5","#9333ea","#64748b","#b91c1c","#16a34a","#0d9488","#2563eb","#334155","#78716c","#c2410c","#0284c7","#6b7280"];
const STRATEGY_DELIVERABLES=["Affiche","Flyer","Invitation","Visuel RS","Autre"];
const MEDIA_DELIVERABLES=["Visuel RS","Emailing","Article SO Mag","Post RS","Story","Article site","Mailing ARC","Autre"];
const lightTask=t=>["Visuel RS","Emailing","Article SO Mag"].includes(t.title)||["Visuel RS","Emailing","Article SO Mag"].includes(t.deliverable_type);
const statusesFor=t=>lightTask(t)?LIGHT_STATUSES:FULL_STATUSES;
let sb=null,token=localStorage.getItem("pilotage_token")||"",me=null,users=[],projects=[],tasks=[],comments=[],notifications=[],files=[],duties=[];
let current="dashboard",currentProject=null,poleFilter=null;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtDate=s=>s?new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"Date à confirmer";
const toast=t=>{let e=$("#toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),1800)};
const makeClient=t=>supabase.createClient(CFG.url,CFG.key,{global:{headers:t?{"x-app-token":t}:{}}});
const userName=id=>users.find(x=>x.id===id)?.display_name||"À attribuer";

async function init(){
 sb=makeClient(token);
 if(token){
   let r=await sb.from("app_users").select("id,username,display_name,role,pole,active").order("display_name");
   if(!r.error){users=r.data||[];me=users.find(x=>x.id===localStorage.getItem("pilotage_user"));if(me?.active){await enter();return}}
 }
 token="";localStorage.removeItem("pilotage_token");localStorage.removeItem("pilotage_user");sb=makeClient();
 let h=await sb.rpc("app_has_users"); loginView(!h.data);
}
function loginView(first=false,msg=""){
 $("#nav").innerHTML="";$(".user").textContent="";$("#search").classList.add("hidden");
 $("#title").textContent="Pilotage Communication";$("#subtitle").textContent="Espace collaboratif de la Direction de la communication.";
 $("#view").innerHTML=`<section class="card loginwrap"><div class="cardhead"><h2>${first?"Créer le premier compte administrateur":"Connexion équipe"}</h2></div><div class="pad">
 ${first?`<label class="muted">Nom affiché</label><input id="display" value="Camille Hispard">`:""}
 <label class="muted">Identifiant</label><input id="username" autocomplete="username" placeholder="Ex. camille">
 <label class="muted">Mot de passe</label><input id="password" type="password" autocomplete="${first?"new-password":"current-password"}" placeholder="Mot de passe">
 ${msg?`<p class="pill block">${esc(msg)}</p>`:""}
 <button class="btn" id="loginBtn">${first?"Créer mon compte":"Se connecter"}</button>
 <p class="muted" style="margin-top:12px">Aucun e-mail n’est nécessaire pour se connecter.</p></div></section>`;
 $("#loginBtn").onclick=async()=>{
   let u=$("#username").value.trim(),p=$("#password").value;if(!u||!p)return;
   if(first){let r=await sb.rpc("app_bootstrap_admin",{p_username:u,p_display_name:$("#display").value.trim()||u,p_password:p});if(r.error)return loginView(true,r.error.message)}
   let r=await sb.rpc("app_login",{p_username:u,p_password:p});if(r.error)return loginView(false,r.error.message);
   let x=r.data?.[0];token=x.token;localStorage.setItem("pilotage_token",token);localStorage.setItem("pilotage_user",x.user_id);sb=makeClient(token);me={id:x.user_id,username:x.username,display_name:x.display_name,role:x.role,pole:x.pole,active:true};await enter();
 };
}
async function enter(){ $("#search").classList.remove("hidden"); await loadAll();subscribe();render() }
async function logout(){try{await sb.rpc("app_logout",{p_token:token})}catch(e){}localStorage.removeItem("pilotage_token");localStorage.removeItem("pilotage_user");location.reload()}
async function loadAll(){
 let [u,p,t,c,n,f,d]=await Promise.all([
  sb.from("app_users").select("id,username,display_name,role,pole,active").order("display_name"),
  sb.from("projects").select("*").order("event_date",{ascending:true,nullsFirst:false}),
  sb.from("tasks").select("*").order("created_at"),
  sb.from("comments").select("*").order("created_at"),
  sb.from("notifications").select("*").eq("user_id",me.id).order("created_at",{ascending:false}),
  sb.from("project_files").select("*").order("created_at",{ascending:false}),
  sb.from("duties").select("*").order("duty_date")
 ]);
 users=u.data||[];projects=p.data||[];tasks=t.data||[];comments=c.data||[];notifications=n.data||[];files=f.data||[];duties=d.data||[];
}
let rtimer;
function refresh(){clearTimeout(rtimer);rtimer=setTimeout(async()=>{await loadAll();render()},200)}
function subscribe(){
 sb.channel("pilotage-live")
 .on("postgres_changes",{event:"*",schema:"public",table:"projects"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"comments"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"project_files"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"app_users"},refresh)
 .on("postgres_changes",{event:"*",schema:"public",table:"duties"},refresh)
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${me.id}`},()=>{beep();refresh()})
 .subscribe();
}
function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.05;o.frequency.value=880;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function nav(){
 let unread=notifications.filter(n=>!n.read_at).length;
 $("#nav").innerHTML=`<button data-view="dashboard">▦ &nbsp; Tableau de bord</button><button data-view="projects">☷ &nbsp; Tous les projets</button><button data-view="calendar">□ &nbsp; Calendrier</button><button data-view="my">✓ &nbsp; Mes tâches</button><button data-view="notifications">🔔 &nbsp; Notifications ${unread?`<span class="pill cab">${unread}</span>`:""}</button><div class="group">Pôles</div>${POLES.map(p=>`<button data-pole="${esc(p)}">${esc(p)}</button>`).join("")}<div class="group">Organisation</div><button data-view="duties">☾ &nbsp; Astreintes</button><div class="group">Pilotage</div><button data-view="validations">✓ &nbsp; Validations</button>${me.role==="admin"?'<button data-view="team">⚙ &nbsp; Utilisateurs</button>':""}<button id="logout">↪ &nbsp; Déconnexion</button>`;
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{current=b.dataset.view;currentProject=null;render()});
 document.querySelectorAll("[data-pole]").forEach(b=>b.onclick=()=>{current="pole";poleFilter=b.dataset.pole;render()});
 $("#logout").onclick=logout;$(".user").textContent=`${me.display_name} · @${me.username}`;
}
function projectTasks(id){return tasks.filter(t=>t.project_id===id)}
function projectComments(id){return comments.filter(c=>c.project_id===id)}
function projectFiles(id){return files.filter(f=>f.project_id===id)}
function dashboard(){
 $("#title").textContent=`Bonjour ${me.display_name.split(" ")[0]} 👋`;$("#subtitle").textContent="Pilotage partagé des projets et actions de communication.";
 let blocked=tasks.filter(t=>t.status==="Bloqué").length,dir=tasks.filter(t=>t.status==="À valider Direction com").length,cab=tasks.filter(t=>t.status==="En attente validation CAB").length,done=tasks.filter(t=>["Terminé","Validé CAB"].includes(t.status)).length;
 $("#view").innerHTML=`<div class="metrics"><div class="metric"><strong>${projects.length}</strong><span>Projets</span></div><div class="metric yellow"><strong>${dir}</strong><span>À valider Direction com</span></div><div class="metric yellow"><strong>${cab}</strong><span>En attente CAB</span></div><div class="metric red"><strong>${blocked}</strong><span>Bloquées</span></div><div class="metric greenbox"><strong>${done}</strong><span>Tâches terminées</span></div></div><section class="card"><div class="cardhead"><h2>Projets</h2><button class="btn" id="newProject">+ Nouveau projet</button></div>${projectTable(projects.slice(0,15))}</section>`;
 $("#newProject").onclick=()=>projectModal();bindProjectRows();
}
function projectTable(list){return `<table><thead><tr><th>Projet</th><th>Date</th><th>Type</th><th>Fichiers</th><th>Avancement</th></tr></thead><tbody>${list.map(p=>{let ts=projectTasks(p.id),d=ts.filter(t=>["Terminé","Validé CAB"].includes(t.status)).length;return `<tr class="click" data-project="${p.id}"><td><b>${esc(p.name)}</b></td><td>${fmtDate(p.event_date)}</td><td>${esc(p.type)}</td><td>${projectFiles(p.id).length}</td><td>${d}/${ts.length}</td></tr>`}).join("")||'<tr><td colspan="5" class="muted">Aucun projet.</td></tr>'}</tbody></table>`}
function bindProjectRows(){document.querySelectorAll("[data-project]").forEach(r=>r.onclick=()=>{currentProject=r.dataset.project;current="project";render()})}
function projectsView(filterPole=null){
 $("#title").textContent=filterPole||"Tous les projets";
 let base=filterPole?projects.filter(p=>projectTasks(p.id).some(t=>t.pole===filterPole)):projects;
 base=[...base].sort((a,b)=>(a.event_date||"9999").localeCompare(b.event_date||"9999")||a.name.localeCompare(b.name));
 $("#subtitle").textContent=filterPole?`${base.length} projets comportant des actions de ce pôle.`:`${base.length} projets / événements enregistrés · toutes dates confondues`;
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><div class="filters"><input id="projSearch" placeholder="Rechercher un événement"><select id="typeFilter"><option value="">Tous les types</option>${TYPES.map(x=>`<option>${x}</option>`).join("")}</select><select id="themeFilter"><option value="">Toutes les thématiques</option>${THEMES.map(x=>`<option>${x}</option>`).join("")}</select><select id="dateFilter"><option value="">Toutes les dates</option><option value="dated">Événements datés</option><option value="tbc">Dates à confirmer</option></select></div><button class="btn" id="newProject">+ Nouveau projet</button></div><div id="resultCount" class="muted" style="padding:0 18px 10px;font-size:11px"></div><div id="ptable">${projectTable(base)}</div></section>`;
 let redraw=()=>{let q=$("#projSearch").value.toLowerCase(),ty=$("#typeFilter").value,th=$("#themeFilter").value,df=$("#dateFilter").value;let arr=base.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!ty||p.type===ty)&&(!th||p.theme===th)&&(!df||(df==="dated"?!!p.event_date:(p.date_tbc||!p.event_date))));$("#resultCount").textContent=`${arr.length} événement${arr.length>1?"s":""} affiché${arr.length>1?"s":""}`;$("#ptable").innerHTML=projectTable(arr);bindProjectRows()};["projSearch","typeFilter","themeFilter","dateFilter"].forEach(id=>$("#"+id).oninput=redraw);$("#newProject").onclick=()=>projectModal();redraw();
}
function myTasks(){
 $("#title").textContent="Mes tâches";$("#subtitle").textContent="Actions qui vous sont attribuées.";
 let mine=tasks.filter(t=>t.assignee_id===me.id);$("#view").innerHTML=`<section class="card"><div class="pad">${mine.map(t=>`<div class="item"><div><b>${esc(t.title)}</b><br><span class="muted">${esc(projects.find(p=>p.id===t.project_id)?.name||"")} · ${esc(t.pole)}</span></div><span class="pill">${esc(t.status)}</span></div>`).join("")||'<span class="muted">Aucune tâche attribuée.</span>'}</div></section>`;
}
function calendar(){
 $("#title").textContent="Calendrier";$("#subtitle").textContent="Les projets dans le temps · lecture par thématique";
 $("#view").innerHTML=`<div class="work-toolbar">${[["7","1 semaine"],["14","2 semaines"],["21","3 semaines"],["90","3 mois"],["365","1 an"]].map((x,i)=>`<button class="btn secondary range-btn ${i===0?"active":""}" data-range="${x[0]}">${x[1]}</button>`).join("")}</div><div id="planning"></div>`;
 const col=p=>THEME_COLORS[Math.max(0,THEMES.indexOf(p.theme))%THEME_COLORS.length];
 const card=p=>`<button class="plan-event" data-project="${p.id}" style="--c:${col(p)}"><b>${esc(p.name)}</b><span>${p.theme?esc(p.theme)+" · ":""}${esc(p.type||"Projet")}</span></button>`;
 const draw=days=>{
   let today=new Date();today.setHours(0,0,0,0), finish=new Date(today);finish.setDate(finish.getDate()+days-1);
   let ps=projects.filter(p=>p.event_date&&new Date(p.event_date+"T12:00:00")>=today&&new Date(p.event_date+"T12:00:00")<=finish);
   let legend=[...new Set(ps.map(p=>p.theme).filter(Boolean))];
   let html=`<div class="planning-head"><div><h2>${days<90?"Planning à venir":"Vue d’ensemble"}</h2><p>${ps.length} projet${ps.length>1?"s":""} sur la période</p></div></div><div class="timeline-legend">${legend.map(th=>`<span class="theme-chip"><i class="theme-dot" style="background:${THEME_COLORS[Math.max(0,THEMES.indexOf(th))%THEME_COLORS.length]}"></i>${esc(th)}</span>`).join("")}</div>`;
   if(days<=21){
     html+=`<div class="plan-board">`;
     for(let w=0;w<Math.ceil(days/7);w++){
       let wd=new Date(today);wd.setDate(wd.getDate()+w*7), we=new Date(wd);we.setDate(we.getDate()+6);
       html+=`<section class="plan-period"><div class="plan-period-head"><div class="plan-period-title">Semaine du ${wd.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}</div><div class="plan-period-count">${ps.filter(p=>{let d=new Date(p.event_date+"T12:00:00");return d>=wd&&d<=we}).length} événement(s)</div></div><div class="plan-days">`;
       for(let i=0;i<7;i++){let d=new Date(wd);d.setDate(d.getDate()+i);let iso=d.toISOString().slice(0,10), arr=ps.filter(p=>p.event_date===iso);html+=`<div class="plan-day"><div class="plan-date">${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}</div>${arr.map(card).join("")}</div>`}
       html+=`</div></section>`;
     } html+=`</div>`;
   } else {
     let months={};ps.forEach(p=>{let d=new Date(p.event_date+"T12:00:00"),k=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});(months[k]??=[]).push(p)});
     html+=`<div class="plan-months">${Object.entries(months).map(([m,arr])=>`<section class="plan-month"><h3>${m} · ${arr.length}</h3>${arr.sort((a,b)=>a.event_date.localeCompare(b.event_date)).map(p=>`<div style="display:grid;grid-template-columns:48px 1fr;gap:5px;align-items:start"><b style="font-size:10px;padding-top:8px">${new Date(p.event_date+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</b>${card(p)}</div>`).join("")}</section>`).join("")||'<div class="duty-empty">Aucun événement daté.</div>'}</div>`;
   }
   let tbc=projects.filter(p=>p.date_tbc||!p.event_date);
   html+=`<section class="tbc-strip"><h3>◷ Dates à confirmer · ${tbc.length}</h3><div class="tbc-items">${tbc.map(p=>`<button class="tbc-item" data-project="${p.id}">${esc(p.name)}</button>`).join("")}</div></section>`;
   $("#planning").innerHTML=html;bindProjectRows();
 };
 draw(7);document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".range-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");draw(+b.dataset.range)});
}
function notificationsView(){
 $("#title").textContent="Notifications";$("#subtitle").textContent="Mentions reçues dans Pilotage Communication.";
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><h2>Cloche</h2><button class="btn secondary small" id="readAll">Tout marquer comme lu</button></div><div class="pad">${notifications.map(n=>`<div class="item click" data-notif="${n.id}" data-nproject="${n.project_id||""}"><div><b>${n.read_at?"":"● "}${esc(userName(n.actor_id))}</b><br>${esc(n.message)}<br><span class="muted">${new Date(n.created_at).toLocaleString("fr-FR")}</span></div></div>`).join("")||'<span class="muted">Aucune notification.</span>'}</div></section>`;
 $("#readAll").onclick=async()=>{await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("user_id",me.id).is("read_at",null);refresh()};
 document.querySelectorAll("[data-notif]").forEach(x=>x.onclick=async()=>{await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("id",x.dataset.notif);if(x.dataset.nproject){currentProject=x.dataset.nproject;current="project";await loadAll();render()}});
}
function validations(){
 $("#title").textContent="Validations";$("#subtitle").textContent="Circuit Direction de la communication puis Cabinet.";
 const block=(title,arr,stage)=>`<section class="card"><div class="cardhead"><h2>${title}</h2></div><div class="pad">${arr.map(t=>`<div class="item"><div><b>${esc(t.title)}</b><br><span class="muted">${esc(projects.find(p=>p.id===t.project_id)?.name||"")}</span></div><div><button class="btn small" data-approve="${t.id}" data-stage="${stage}">Valider</button> <button class="btn secondary small" data-return="${t.id}">Modification</button></div></div>`).join("")||'<span class="muted">Rien à valider.</span>'}</div></section>`;
 $("#view").innerHTML=block("Validation Direction com",tasks.filter(t=>t.status==="À valider Direction com"),"Direction com")+block("Validation CAB",tasks.filter(t=>t.status==="En attente validation CAB"),"CAB");
 document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=async()=>{await sb.from("tasks").update({status:b.dataset.stage==="Direction com"?"Validé Direction com":"Validé CAB"}).eq("id",b.dataset.approve);toast("Validé")});
 document.querySelectorAll("[data-return]").forEach(b=>b.onclick=async()=>{await sb.from("tasks").update({status:"En cours"}).eq("id",b.dataset.return);toast("Renvoyé en modification")});
}
function teamView(){
 $("#title").textContent="Utilisateurs";$("#subtitle").textContent="Comptes de connexion et personnes disponibles dans les @mentions.";
 $("#view").innerHTML=`<section class="card"><div class="cardhead"><h2>Équipe</h2><button class="btn" id="addUser">+ Utilisateur</button></div><table><thead><tr><th>Nom</th><th>Identifiant</th><th>Pôle</th><th>Rôle</th><th>État</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.display_name)}</b></td><td>@${esc(u.username)}</td><td>${esc(u.pole||"")}</td><td>${esc(u.role)}</td><td>${u.active?"Actif":"Désactivé"}</td><td><button class="btn secondary small" data-pass="${u.id}">Mot de passe</button> <button class="btn secondary small" data-active="${u.id}" data-val="${!u.active}">${u.active?"Désactiver":"Activer"}</button></td></tr>`).join("")}</tbody></table></section>`;
 $("#addUser").onclick=userModal;document.querySelectorAll("[data-pass]").forEach(b=>b.onclick=async()=>{let p=prompt("Nouveau mot de passe (6 caractères minimum) :");if(!p)return;let r=await sb.rpc("app_reset_password",{p_user:b.dataset.pass,p_password:p});if(r.error)alert(r.error.message);else toast("Mot de passe modifié")});
 document.querySelectorAll("[data-active]").forEach(b=>b.onclick=async()=>{let r=await sb.rpc("app_set_user_active",{p_user:b.dataset.active,p_active:b.dataset.val==="true"});if(r.error)alert(r.error.message);else refresh()});
}
function userModal(){
 $("#modal").className="modal";$("#modal").innerHTML=`<div class="modalbox"><h2>Nouvel utilisateur</h2><div class="formgrid" style="margin-top:15px"><label><span>Nom affiché</span><input id="ud"></label><label><span>Identifiant</span><input id="uu" placeholder="prenom"></label><label><span>Mot de passe initial</span><input id="up" type="password"></label><label><span>Pôle</span><select id="upo"><option value="">—</option>${TEAM_POLES.map(p=>`<option>${p}</option>`).join("")}</select></label><label><span>Rôle</span><select id="ur"><option value="user">Utilisateur</option><option value="admin">Admin</option></select></label></div><div style="text-align:right;margin-top:15px"><button class="btn secondary" id="uc">Annuler</button> <button class="btn" id="us">Créer</button></div></div>`;
 $("#uc").onclick=closeModal;$("#us").onclick=async()=>{let r=await sb.rpc("app_create_user",{p_username:$("#uu").value,p_display_name:$("#ud").value,p_password:$("#up").value,p_role:$("#ur").value,p_pole:$("#upo").value||null});if(r.error)return alert(r.error.message);closeModal();toast("Utilisateur créé");refresh()};
}

function poleUsers(pole){return users.filter(u=>u.active&&u.pole===pole)}
function userOptions(pole,selected,allowAll=false){
 let arr=allowAll?users.filter(u=>u.active):poleUsers(pole);
 return `<option value="">À attribuer</option>`+arr.map(u=>`<option value="${u.id}" ${selected===u.id?"selected":""}>${esc(u.display_name)}</option>`).join("");
}

function bindFiles(p){

async function uploadFiles(p,list){
 for(let f of list){let ext=f.name.split(".").pop().toLowerCase(),kind=f.type.startsWith("image/")?"photo":ext==="pdf"?"pdf":(["doc","docx"].includes(ext)?"word":"");if(!kind){alert("Format non accepté : "+f.name);continue}
  let path=`${p.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;let up=await sb.storage.from("project-files").upload(path,f);if(up.error){alert(up.error.message);continue}

async function deleteFile(f,p){if(!confirm("Supprimer définitivement ce fichier ?"))return;let r=await sb.storage.from("project-files").remove([f.storage_path]);if(r.error)return alert(r.error.message);await sb.from("project_files").delete().eq("id",f.id);toast("Fichier supprimé");refresh()}
function renderComments(pid){
 let all=projectComments(pid),roots=all.filter(c=>!c.parent_id);

 return roots.map(c=>one(c)+all.filter(r=>r.parent_id===c.id).map(r=>one(r,true)).join("")).join("")||'<div class="muted" style="margin-bottom:10px">Aucun commentaire.</div>';

 toast("Commentaire ajouté");refresh()
}

function projectModal(p=null){
 $("#modal").className="modal";$("#modal").innerHTML=`<div class="modalbox"><h2>${p?"Modifier":"Nouveau"} projet</h2><div class="formgrid" style="margin-top:15px"><label><span>Nom</span><input id="pn" value="${esc(p?.name||"")}"></label><label><span>Date</span><input id="pd" type="date" value="${esc(p?.event_date||"")}"><small class="muted">Vide = date à confirmer</small></label><label><span>Type</span><select id="pt">${TYPES.map(x=>`<option ${p?.type===x?"selected":""}>${x}</option>`).join("")}</select></label><label><span>Priorité</span><select id="pp">${["Basse","Normale","Haute","Urgente"].map(x=>`<option ${p?.priority===x?"selected":""}>${x}</option>`).join("")}</select></label><label><span>Thématique</span><select id="pth"><option value="">Non thématisé</option>${THEMES.map(x=>`<option ${p?.theme===x?"selected":""}>${x}</option>`).join("")}</select></label></div><label style="display:block;margin-top:10px"><span class="muted">Description</span><textarea id="px">${esc(p?.description||"")}</textarea></label><div style="display:flex;justify-content:space-between;margin-top:15px"><div>${p?'<button class="btn danger" id="pdel">Supprimer le projet</button>':""}</div><div><button class="btn secondary" id="pc">Annuler</button> <button class="btn" id="ps">Enregistrer</button></div></div></div>`;
 $("#pc").onclick=closeModal;if(p)$("#pdel").onclick=async()=>{if(confirm("Supprimer définitivement ce projet ?")){await sb.from("projects").delete().eq("id",p.id);closeModal();current="projects";refresh()}};
 $("#ps").onclick=async()=>{let name=$("#pn").value.trim();if(!name)return alert("Le nom est obligatoire.");let row={name,type:$("#pt").value,event_date:$("#pd").value||null,date_tbc:!$("#pd").value,priority:$("#pp").value,theme:$("#pth").value||null,description:$("#px").value,updated_at:new Date().toISOString()};let r;
 if(p)r=await sb.from("projects").update(row).eq("id",p.id);else{row.created_by=me.id;r=await sb.from("projects").insert(row).select().single();if(!r.error){let defaults={"Médias":["Post réseaux sociaux","Article site","Mailing ARC"],"Événementiel":["Organisation / déroulé","Logistique"],"Stratégie & contenus":["Affiche","Invitation"],"Vidéo":["Captation / montage"],"Mission cinéma et partenariat":["Partenaires / suivi"]},rows=[];for(let po of POLES)for(let title of defaults[po])rows.push({project_id:r.data.id,pole:po,title,subpole:po==="Stratégie & contenus"?"Graphiste":(po==="Médias"?(title==="Article site"?"Digital":"Digital"):null),due_date:r.data.event_date,status:"À faire",created_by:me.id});await sb.from("tasks").insert(rows)}}
 if(r.error)return alert(r.error.message);closeModal();toast("Projet enregistré");refresh()};
}
function closeModal(){$("#modal").className="hidden"}
function render(){nav();if(current==="dashboard")dashboard();else if(current==="projects")projectsView();else if(current==="pole")projectsView(poleFilter);else if(current==="my")myTasks();else if(current==="calendar")calendar();else if(current==="validations")validations();else if(current==="team")teamView();else if(current==="notifications")notificationsView();else if(current==="duties")dutiesView();else if(current==="project")projectView()}
$("#search").oninput=e=>{let q=e.target.value.trim();if(!q)return;current="projects";projectsView();let i=$("#projSearch");if(i){i.value=q;i.dispatchEvent(new Event("input"))}}
init();
</script></body></html>
